<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Vault — Dashboard</title>

  <!-- Bootstrap 5.3 (light mode) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- vis.js Network for interactive graphs -->
  <link href="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/dist/vis-network.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/vis-network.min.js"></script>

  <!-- Mermaid for diagrams -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Custom overrides -->
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app-layout">
    <!-- ═══════════ SIDEBAR ═══════════ -->
    <aside class="app-sidebar">
      <div class="sidebar-brand">
        <i class="bi bi-diamond-fill"></i>
        <span>Knowledge Vault</span>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">VIEWS</div>
        <div class="nav-item active" data-view="overview">
          <i class="bi bi-grid-1x2-fill"></i>
          <span>Overview</span>
        </div>
        <div class="nav-item" data-view="timeline">
          <i class="bi bi-clock-history"></i>
          <span>Timeline</span>
        </div>
        <div class="nav-item" data-view="graph">
          <i class="bi bi-diagram-3-fill"></i>
          <span>Connections</span>
        </div>
        <div class="nav-item" data-view="work-items">
          <i class="bi bi-funnel-fill"></i>
          <span>Work Items</span>
        </div>
        <div class="nav-item" data-view="daily-summary">
          <i class="bi bi-journal-text"></i>
          <span>Daily Summary</span>
        </div>
        <div class="nav-item" data-view="tags">
          <i class="bi bi-tags-fill"></i>
          <span>Tags</span>
        </div>
        <div class="nav-item" data-view="post-mortem">
          <i class="bi bi-shield-exclamation"></i>
          <span>Post-Mortem</span>
        </div>
        <div class="nav-item" data-view="knowledge-gaps">
          <i class="bi bi-clipboard2-pulse"></i>
          <span>Knowledge Gaps</span>
        </div>
        <div class="nav-item" data-view="impact-radar">
          <i class="bi bi-broadcast-pin"></i>
          <span>Impact Radar</span>
        </div>

        <div class="nav-section-label">PROJECTS</div>
        <div class="nav-projects" id="nav-projects"></div>

        <div class="nav-section-label">TRACKING</div>
        <div class="nav-item" data-view="bugs">
          <i class="bi bi-bug-fill text-danger"></i>
          <span>Bugs</span>
          <span class="badge bg-danger ms-auto" id="bug-count">0</span>
        </div>
        <div class="nav-item" data-view="incidents">
          <i class="bi bi-exclamation-triangle-fill text-warning"></i>
          <span>Incidents</span>
          <span class="badge bg-warning ms-auto" id="incident-count">0</span>
        </div>
        <div class="nav-item" data-view="tickets">
          <i class="bi bi-ticket-detailed-fill text-info"></i>
          <span>Tickets</span>
          <span class="badge bg-info ms-auto" id="ticket-count">0</span>
        </div>
        <div class="nav-item" data-view="updates">
          <i class="bi bi-arrow-up-circle-fill text-success"></i>
          <span>Updates</span>
          <span class="badge bg-success bg-opacity-75 ms-auto" id="update-count">0</span>
        </div>
        <div class="nav-item" data-view="pr-reviews">
          <i class="bi bi-git" style="color:#8957e5"></i>
          <span>PR Reviews</span>
          <span class="badge ms-auto" style="background-color:#8957e5" id="pr-count">0</span>
        </div>
        <div class="nav-item" data-view="sessions">
          <i class="bi bi-journal-code"></i>
          <span>Sessions</span>
          <span class="badge bg-primary bg-opacity-50 ms-auto" id="session-count">0</span>
        </div>
        <div class="nav-item" data-view="skills">
          <i class="bi bi-lightbulb"></i>
          <span>Skills</span>
          <span class="badge bg-warning bg-opacity-75 ms-auto" id="skill-count">0</span>
        </div>
      </nav>
    </aside>

    <!-- ═══════════ MAIN AREA ═══════════ -->
    <div class="app-main">
      <!-- Header -->
      <header class="app-header">
        <h1 class="app-header-title" id="page-title">Overview</h1>
        <div class="app-header-actions">
          <select class="form-select form-select-sm project-selector" id="global-project-select">
            <option value="">All Projects</option>
          </select>
        </div>
      </header>

      <!-- Content -->
      <main class="app-content">
        <!-- Overview -->
        <section class="view active" id="view-overview">
          <div class="row g-3 mb-4" id="stats-grid"></div>
          <div class="row g-4">
            <div class="col-lg-6">
              <div class="card">
                <div class="card-header">
                  <i class="bi bi-clock-history text-primary me-2"></i>Recent Activity
                </div>
                <div class="card-body p-0" id="activity-list"></div>
              </div>
            </div>
            <div class="col-lg-6">
              <div class="card">
                <div class="card-header">
                  <i class="bi bi-exclamation-octagon text-danger me-2"></i>Open Issues
                </div>
                <div class="card-body p-0" id="open-issues-list"></div>
              </div>
            </div>
          </div>
        </section>

        <!-- Timeline -->
        <section class="view" id="view-timeline">
          <div id="timeline-container"></div>
        </section>

        <!-- Graph / Connections (vis.js) -->
        <section class="view" id="view-graph">
          <div class="graph-wrapper" id="graph-container"></div>
        </section>

        <!-- Work Items (Global Filter + Pagination) -->
        <section class="view" id="view-work-items">
          <div class="card mb-4">
            <div class="card-body">
              <div class="row g-3 align-items-end">
                <div class="col-md-2">
                  <label class="form-label">Project</label>
                  <select class="form-select form-select-sm" id="wi-project"></select>
                </div>
                <div class="col-md-2">
                  <label class="form-label">Feature</label>
                  <select class="form-select form-select-sm" id="wi-feature"></select>
                </div>
                <div class="col-md-2">
                  <label class="form-label">Type</label>
                  <select class="form-select form-select-sm" id="wi-type"></select>
                </div>
                <div class="col-md-2">
                  <label class="form-label">Status</label>
                  <select class="form-select form-select-sm" id="wi-status"></select>
                </div>
                <div class="col-md-2">
                  <label class="form-label">From</label>
                  <input type="date" class="form-control form-control-sm" id="wi-from">
                </div>
                <div class="col-md-2">
                  <label class="form-label">To</label>
                  <input type="date" class="form-control form-control-sm" id="wi-to">
                </div>
              </div>
            </div>
          </div>
          <div id="wi-results"></div>
          <div id="wi-pagination" class="d-flex align-items-center justify-content-between mt-3"></div>
        </section>

        <!-- Daily Summary -->
        <section class="view" id="view-daily-summary">
          <div id="daily-summary-content"></div>
        </section>

        <!-- Tags -->
        <section class="view" id="view-tags"></section>

        <!-- Post-Mortem -->
        <section class="view" id="view-post-mortem"></section>

        <!-- Knowledge Gaps -->
        <section class="view" id="view-knowledge-gaps"></section>

        <!-- Impact Radar -->
        <section class="view" id="view-impact-radar"></section>

        <!-- Feature Content -->
        <section class="view" id="view-feature-content">
          <div id="feature-content-body"></div>
        </section>

        <!-- Entity Content -->
        <section class="view" id="view-entity-content">
          <div id="entity-content-body"></div>
        </section>

        <!-- Tracking views (dynamically rendered) -->
        <section class="view" id="view-bugs"></section>
        <section class="view" id="view-incidents"></section>
        <section class="view" id="view-tickets"></section>
        <section class="view" id="view-updates"></section>
        <section class="view" id="view-sessions"></section>
        <section class="view" id="view-skills"></section>
        <section class="view" id="view-pr-reviews"></section>
      </main>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- App -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
